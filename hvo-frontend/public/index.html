<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!-- 파비콘 교체 후 안 보이면 ?v= 값을 올리고 재빌드(또는 강력 새로고침 Ctrl+Shift+R) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=8" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png?v=8" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48x48.png?v=8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hyvision One" />
    <meta name="application-name" content="Hyvision One" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0D2B5B" />
    <meta
      name="description"
      content="Hyvision One - Integrated ERP and system integration platform optimized for Hyvision India"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hyvision One" />
    <meta property="og:title" content="Hyvision One - Integrated ERP for Hyvision India" />
    <meta
      property="og:description"
      content="Hyvision One - Integrated ERP and system integration platform optimized for Hyvision India"
    />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hyvision One - Integrated ERP for Hyvision India" />
    <meta
      name="twitter:description"
      content="Hyvision One - Integrated ERP and system integration platform optimized for Hyvision India"
    />
    <!-- PC/모바일 OS·브라우저 언어에 따라 SEO 메타를 한글·영어로 즉시 적용 (JS 번들 로드 전) -->
    <script>
      (function () {
        try {
          var list = [];
          if (navigator.languages && navigator.languages.length) {
            for (var i = 0; i < navigator.languages.length; i++) list.push(navigator.languages[i]);
          }
          if (navigator.language) list.push(navigator.language);
          if (navigator.userLanguage) list.push(navigator.userLanguage);
          var isKorean = false;
          for (var j = 0; j < list.length; j++) {
            if (String(list[j] || '').toLowerCase().indexOf('ko') === 0) {
              isKorean = true;
              break;
            }
          }
          var seo = isKorean
            ? {
                lang: 'ko',
                locale: 'ko_KR',
                alternate: 'en_IN',
                title: 'Hyvision One - 하이비전 인도 통합 ERP',
                description: 'Hyvision One - Hyvision India를 위한 통합 ERP·시스템 인티그레이션 플랫폼'
              }
            : {
                lang: 'en',
                locale: 'en_IN',
                alternate: 'ko_KR',
                title: 'Hyvision One - Integrated ERP for Hyvision India',
                description:
                  'Hyvision One - Integrated ERP and system integration platform optimized for Hyvision India'
              };
          document.documentElement.lang = seo.lang;
          document.title = seo.title;
          var setName = function (name, content) {
            var tag = document.querySelector('meta[name="' + name + '"]');
            if (tag) tag.setAttribute('content', content);
          };
          var setProp = function (property, content) {
            var tag = document.querySelector('meta[property="' + property + '"]');
            if (tag) tag.setAttribute('content', content);
          };
          setName('description', seo.description);
          setName('twitter:title', seo.title);
          setName('twitter:description', seo.description);
          setProp('og:title', seo.title);
          setProp('og:description', seo.description);
          setProp('og:locale', seo.locale);
          setProp('og:locale:alternate', seo.alternate);
        } catch (e) {
          /* 언어 감지 실패 시 정적 영문 메타 유지 */
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=7" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png?v=7" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo192.png?v=7" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Noto+Sans+KR:wght@300..800&display=swap"
    />
    <title>Hyvision One - Integrated ERP for Hyvision India</title>
  </head>

    <div id="root"></div>
  </body>
</html>
